name: montra

services:
  postgres:
    image: postgres:16-alpine
    container_name: montra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-montra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-montra_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV_DB_PASSWORD}
      TZ: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-montra_app} -d $${POSTGRES_DB:-montra_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: montra-ml
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_HOST: 0.0.0.0
      ML_PORT: 8000
      ML_MODEL_ARTIFACTS_DIR: /app/artifacts
      ML_CATEGORY_MODEL_VERSION: ${ML_CATEGORY_MODEL_VERSION:-untrained-v0}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-CHANGE_ME_INTERNAL_SERVICE_SHARED_TOKEN}
    volumes:
      - ./services/ml/artifacts:/app/artifacts:ro
    expose:
      - "8000"
    networks:
      - internal_ml_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: montra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_READ_TIMEOUT_MS: ${API_READ_TIMEOUT_MS:-5000}
      API_WRITE_TIMEOUT_MS: ${API_WRITE_TIMEOUT_MS:-10000}
      API_SHUTDOWN_TIMEOUT_MS: ${API_SHUTDOWN_TIMEOUT_MS:-10000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-IDR}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-montra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-montra_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV_DB_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_SERVICE_BASE_URL: http://ml:8000
      ML_CLIENT_TIMEOUT_MS: ${ML_CLIENT_TIMEOUT_MS:-1500}
      ML_CATEGORY_CONFIDENCE_THRESHOLD: ${ML_CATEGORY_CONFIDENCE_THRESHOLD:-0.75}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-CHANGE_ME_INTERNAL_SERVICE_SHARED_TOKEN}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - public_net
      - backend_net
      - internal_ml_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  proxy:
    image: caddy:2.8-alpine
    container_name: montra-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROXY_HTTP_PORT:-8088}:80"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - public_net

networks:
  public_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  internal_ml_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
